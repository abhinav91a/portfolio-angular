<header class="sticky top-0 z-50 border-b border-slate-200/70 bg-white/80 backdrop-blur-md">
  <nav class="container-x flex h-16 items-center justify-between gap-4">
    <a routerLink="/" class="flex shrink-0 items-center gap-2.5 font-bold tracking-tight text-slate-900">
      <span class="grid h-8 w-8 place-items-center rounded-lg bg-linear-to-br from-blue-600 to-violet-600 text-xs font-extrabold text-white">AS</span>
      <span class="hidden sm:inline">{{ profile.name }}</span>
    </a>
    <ul class="flex min-w-0 gap-1 overflow-x-auto text-sm font-medium">
      @for (item of nav; track item.path) {
        <li>
          <a [routerLink]="item.path"
             [routerLinkActiveOptions]="{ exact: item.path === '/' }"
             routerLinkActive="bg-slate-900 text-white"
             class="block whitespace-nowrap rounded-full px-3.5 py-2 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">{{ item.label }}</a>
        </li>
      }
    </ul>
    <a mat-flat-button routerLink="/contact" class="hidden shrink-0 sm:inline-flex">Get in touch</a>
  </nav>
</header>

<main class="min-h-[70vh]">
  <router-outlet />
</main>

<footer class="bg-slate-950 text-slate-400">
  <div class="container-x flex flex-col gap-6 py-10 sm:flex-row sm:items-center sm:justify-between">
    <p class="text-sm">© {{ year }} {{ profile.name }}. Built with Angular, Tailwind CSS and Angular Material.</p>
    <div class="flex gap-6 text-sm">
      <a [href]="profile.github" target="_blank" rel="noopener" class="transition hover:text-white">GitHub</a>
      <a [href]="profile.linkedin" target="_blank" rel="noopener" class="transition hover:text-white">LinkedIn</a>
      <a [href]="'mailto:' + profile.email" class="transition hover:text-white">Email</a>
    </div>
  </div>
</footer>
